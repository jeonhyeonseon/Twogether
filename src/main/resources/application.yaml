spring:
  application:
    name: think_different
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.naver.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

server:
  servlet:
    context-path: /
  # 에러 발생 시 스택트레이스/예외 정보를 화면에 노출하지 않음 (templates/error/error.html 사용)
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

holiday:
  api:
    key: ${HOLIDAY_API_KEY}

weather:
  api:
    key: ${WEATHER_API_KEY}