<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/login}">
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/member/join.css}">
    <link rel="stylesheet" th:href="@{/css/member/find.css}">
    <script th:src="@{/js/member/find-account.js}"></script>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="join-container">
            <!-- 비밀번호 값은 다시 채우지 않도록 th:field 대신 name/id 직접 지정 -->
            <form class="join-form reset-form" th:action="@{/members/reset-password}" th:object="${passwordResetRequestDto}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <h2 class="join-title">비밀번호 재설정</h2>

                <p class="find-desc">새로 사용할 비밀번호를 입력해주세요.</p>

                <div class="form-field">
                    <input type="password" id="newPassword" name="newPassword" placeholder="새 비밀번호 (8자 이상, 영문+숫자+특수문자)" required>
                    <span id="new-password-format-msg" class="msg"
                          th:classappend="${#fields.hasErrors('newPassword')} ? 'error-msg' : ''"
                          th:text="${#fields.hasErrors('newPassword')} ? ${#fields.errors('newPassword')[0]} : ''"></span>
                </div>

                <div class="form-field">
                    <input type="password" id="newPasswordConfirm" name="newPasswordConfirm" placeholder="새 비밀번호를 다시 입력해주세요" required>
                    <span id="new-password-msg" class="msg"
                          th:classappend="${#fields.hasErrors('newPasswordConfirm')} ? 'error-msg' : ''"
                          th:text="${#fields.hasErrors('newPasswordConfirm')} ? ${#fields.errors('newPasswordConfirm')[0]} : ''"></span>
                </div>

                <button class="join-btn" type="submit">비밀번호 재설정</button>
            </form>
        </div>
    </th:block>
</body>
</html>
