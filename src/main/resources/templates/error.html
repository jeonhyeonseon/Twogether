<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/login}">
<head>
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/member/join.css}">
    <style>
        .error-home-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- 사용자용 에러 화면 (스택트레이스/예외 메시지는 노출하지 않음) -->
    <th:block layout:fragment="content">
        <div class="join-container">
            <div class="join-form">
                <h2 class="join-title" th:switch="${status}">
                    <span th:case="403">접근 권한이 없습니다.</span>
                    <span th:case="404">페이지를 찾을 수 없습니다.</span>
                    <span th:case="*">일시적인 오류가 발생했습니다.</span>
                </h2>

                <p class="join-help">잠시 후 다시 시도해주세요.</p>

                <a class="join-btn error-home-btn" th:href="@{/}">메인으로</a>
            </div>
        </div>
    </th:block>
</body>
</html>
